[build]
  command = "npm update && npm run build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  NODE_VERSION = "22.13.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://kartikagarwal.netlify.app/*"
  to = "https://kartik-agarwal.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Signal = "ai-train=no, search=yes, ai-input=yes"

[[headers]]
  for = "/"
  [headers.values]
    Link = "</.well-known/api-catalog>; rel=\"api-catalog\"; type=\"application/linkset+json\", </portfolio.md>; rel=\"alternate\"; type=\"text/markdown\"; title=\"Kartik Agarwal portfolio in Markdown\", </.well-known/agent-skills/index.json>; rel=\"related\"; type=\"application/json\"; title=\"Agent Skills index\", </Kartik_Agarwal.pdf>; rel=\"alternate\"; type=\"application/pdf\"; title=\"Kartik Agarwal resume\""
    Vary = "Accept, RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch, Accept-Encoding"

[[headers]]
  for = "/.well-known/agent-skills/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/.well-known/agent-skills/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
